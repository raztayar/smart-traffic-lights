[project]
name = "smart-traffic-lights"
version = "0.1.0"
description = "Adaptive traffic-light control: an RL controller benchmarked against classical baselines in SUMO, with a camera perception pipeline."
authors = [
    { name = "Raz Tayar", email = "raztayar@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "eclipse-sumo>=1.28.0",
    "libsumo>=1.28.0",
    "traci>=1.28.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
